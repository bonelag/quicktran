name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get_version
        shell: bash
        run: |
          version=$(jq -r '.version' package.json)
          echo "version=v$version" >> $GITHUB_OUTPUT
          echo "raw_version=$version" >> $GITHUB_OUTPUT

      - name: Build Tauri App (WebView)
        run: npm run tauri build

      - name: Build Native App
        run: cargo build --release

      - name: Prepare Release Binaries
        shell: bash
        run: |
          ver="${{ steps.get_version.outputs.raw_version }}"
          cp src-tauri/target/release/QuickTran.exe "QuickTran-${ver}-webview.exe"
          cp target/release/quicktran.exe "QuickTran-${ver}-native.exe"

      - name: Create or Update Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: QuickTran ${{ steps.get_version.outputs.version }}
          files: |
            QuickTran-${{ steps.get_version.outputs.raw_version }}-webview.exe
            QuickTran-${{ steps.get_version.outputs.raw_version }}-native.exe
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
